name: Divulgacao diaria

# Horarios de pico no Brasil (BRT = UTC-3):
# 12:30 BRT (almoco) e 19:30 BRT (pico da noite) = 15:30 e 22:30 UTC
on:
  schedule:
    - cron: '30 15,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  divulgar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Avisar buscadores + girar CTA do dia
        run: python automacao/divulgacao.py
      - name: Publicar CTA do dia
        run: |
          git config user.name "Rickdigitalestudio"
          git config user.email "Rickdigitalestudio@users.noreply.github.com"
          git add index.html cta-do-dia.md
          git diff --cached --quiet || git commit -m "chore: CTA do dia + aviso aos buscadores [auto]"
          git push
